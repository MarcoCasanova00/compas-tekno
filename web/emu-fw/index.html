<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     Compás TEKNO — FM-1-style browser emulator running the real firmware engine
     (src/engine.c + packed bank compiled to WASM). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compás TEKNO — FM-1 emulator</title>
<style>
:root { --bg:#0c0c0e; --fg:#e8e8ec; --dim:#8a8a92; --body:#141416; --edge:#33333a;
        --lcd:#4a3d26; --lcdglow:#ffb000; --lcddim:#6b5528; --led:#ff9f1c; --ledoff:#1c1c20; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
main { max-width:640px; margin:0 auto; padding:28px 14px 40px; }
h1 { font-size:20px; letter-spacing:2px; margin:0 0 2px; }
h1 span { color:var(--led); }
p.sub { color:var(--dim); margin:0 0 16px; font-size:12px; }

.device { background:var(--body); border:1px solid var(--edge); border-radius:22px;
          padding:18px 18px 20px; box-shadow:0 10px 30px rgba(0,0,0,.5); }

.top { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
.brand { font-size:11px; letter-spacing:3px; color:var(--dim); }
.brand b { color:var(--fg); }

.lcd { background:var(--lcd); border-radius:8px; padding:10px 12px; flex:1;
       box-shadow:inset 0 0 18px rgba(0,0,0,.55); }
#lcd { display:block; width:100%; height:auto; image-rendering:pixelated; }

.leds { display:grid; grid-template-columns:repeat(32,1fr); gap:3px; margin:12px 0 14px; }
.leds .led { aspect-ratio:1; background:var(--ledoff); border-radius:2px; }
.leds .led.on { background:var(--led); box-shadow:0 0 6px var(--led); }
.leds .led.cur { outline:2px solid #fff3; }

.controls { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.panel { background:#1a1a1e; border:1px solid var(--edge); border-radius:12px; padding:12px; }
.panel h3 { margin:0 0 8px; font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }

.knob { display:flex; flex-direction:column; align-items:center; gap:6px; }
.knob .dial { width:64px; height:64px; border-radius:50%; position:relative;
               background:radial-gradient(circle at 50% 38%, #3a3a42, #17171b 68%);
               border:2px solid var(--edge); cursor:ns-resize; touch-action:none; }
.knob .dial .tick { position:absolute; left:50%; top:6px; width:2px; height:10px;
                     transform:translateX(-50%); background:var(--led); transform-origin:2px 26px; }
.knob b { font-size:11px; color:var(--dim); letter-spacing:1px; }
.knob span { font-size:16px; font-weight:600; }

.btns { display:flex; gap:8px; flex-wrap:wrap; }
button.b { flex:1; min-width:84px; background:#26262c; color:var(--fg);
           border:1px solid var(--edge); border-radius:10px; padding:12px 8px;
           font:600 12px/1 inherit; cursor:pointer; }
button.b.lit { background:var(--led); color:#161616; border-color:var(--led); }
button.b:disabled { opacity:.4; cursor:default; }

.pads { display:grid; grid-template-columns:repeat(16,1fr); gap:4px; margin-top:12px; }
.pads .pad { aspect-ratio:1; background:#202024; border:1px solid var(--edge);
              border-radius:4px; cursor:pointer; }
.pads .pad.lit { background:#33333c; }
.pads .pad.cur { outline:2px solid var(--led); }

footer { margin-top:14px; color:var(--dim); font-size:11px; text-align:center; }
footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Compás <span>TEKNO</span></h1>
  <p class="sub">FM-1 emulator — runs the actual firmware engine (WASM)</p>

  <div class="device">
    <div class="top">
      <div class="brand"><b>M-VAVE</b><br>FM-1 · Compás TEKNO</div>
      <div class="lcd"><canvas id="lcd" width="336" height="96"></canvas></div>
    </div>

    <div class="leds" id="leds"></div>

    <div class="controls">
      <div class="panel">
        <h3>Encoders</h3>
        <div style="display:flex; gap:18px; justify-content:center;">
          <div class="knob">
            <div class="dial" id="dialBpm" data-knob="bpm"><div class="tick"></div></div>
            <b>BPM</b><span id="bpmval">155</span>
          </div>
          <div class="knob">
            <div class="dial" id="dialVol" data-knob="vol"><div class="tick"></div></div>
            <b>VOL</b><span id="volval">85</span>
          </div>
        </div>
      </div>
      <div class="panel">
        <h3>Transport &amp; Presets</h3>
        <div class="btns">
          <button class="b" id="play" disabled>▶ PLAY</button>
          <button class="b" id="prev" disabled>⟨ PRESET</button>
          <button class="b" id="next" disabled>PRESET ⟩</button>
        </div>
        <div class="btns" style="margin-top:8px;">
          <button class="b" id="presetName" disabled title="Current preset">—</button>
        </div>
      </div>
    </div>

    <div class="pads" id="pads"></div>
  </div>

  <footer>
    Modified <a href="https://github.com/TexasRADIO/compas-firmware">Compás</a> (GPL-3.0)
    · UFO French/tribe bank · <a href="https://github.com/MarcoCasanova00/compas-tekno">repo</a>
    · <a href="https://marcocasanova00.github.io/compas-tekno/">live</a>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const CP_START=1, CP_STOP=2, CP_STUDY=3, CP_BPM=9, CP_FEEL=10;
const ST_POSITION=4;

let fw, presets = [], cur = 0, playing = false;
let ctx, node, gain;
let renderTimer = null, posTimer = null;
let bpm = 155, vol = 85;

/* ---------------- dot-matrix LCD ---------------- */
const FONT = {
  A:[0x1F,0x11,0x1F,0x11,0x11], B:[0x1E,0x11,0x1E,0x11,0x1E],
  C:[0x0F,0x10,0x10,0x10,0x0F], D:[0x1E,0x11,0x11,0x11,0x1E],
  E:[0x1F,0x10,0x1E,0x10,0x1F], F:[0x1F,0x10,0x1E,0x10,0x10],
  G:[0x0F,0x10,0x17,0x11,0x0F], H:[0x11,0x11,0x1F,0x11,0x11],
  I:[0x1F,0x04,0x04,0x04,0x1F], J:[0x07,0x02,0x02,0x12,0x0C],
  K:[0x11,0x12,0x1C,0x12,0x11], L:[0x10,0x10,0x10,0x10,0x1F],
  M:[0x11,0x1B,0x15,0x11,0x11], N:[0x11,0x19,0x15,0x13,0x11],
  O:[0x0E,0x11,0x11,0x11,0x0E], P:[0x1E,0x11,0x1E,0x10,0x10],
  Q:[0x0E,0x11,0x15,0x12,0x0D], R:[0x1E,0x11,0x1E,0x12,0x11],
  S:[0x0F,0x10,0x0E,0x01,0x1E], T:[0x1F,0x04,0x04,0x04,0x04],
  U:[0x11,0x11,0x11,0x11,0x0E], V:[0x11,0x11,0x11,0x0A,0x04],
  W:[0x11,0x11,0x15,0x1B,0x11], X:[0x11,0x0A,0x04,0x0A,0x11],
  Y:[0x11,0x0A,0x04,0x04,0x04], Z:[0x1F,0x02,0x04,0x08,0x1F],
  '0':[0x0E,0x11,0x13,0x15,0x0E], '1':[0x04,0x0C,0x04,0x04,0x0E],
  '2':[0x0E,0x11,0x02,0x04,0x1F], '3':[0x1E,0x01,0x0E,0x01,0x1E],
  '4':[0x02,0x06,0x0A,0x1F,0x02], '5':[0x1F,0x10,0x1E,0x01,0x1E],
  '6':[0x0E,0x10,0x1E,0x11,0x0E], '7':[0x1F,0x01,0x02,0x04,0x04],
  '8':[0x0E,0x11,0x0E,0x11,0x0E], '9':[0x0E,0x11,0x0F,0x01,0x0E],
  ' ':[0,0,0,0,0], '-':[0,0,0x1F,0,0], '.':[0,0,0,0,0x04],
  ':':[0,0x04,0,0x04,0], '/':[0x01,0x02,0x04,0x08,0x10],
  '+':[0,0x04,0x0E,0x04,0],
};
function lcdText(ctx, text, x, y, glow) {
  ctx.fillStyle = glow ? '#ffd980' : '#b08a3c';
  for (const ch of String(text).toUpperCase()) {
    const g = FONT[ch] || FONT[' '];
    for (let c = 0; c < 5; c++) for (let r = 0; r < 7; r++) {
      if (g[c] & (1 << (6 - r))) ctx.fillRect(x + c * 2, y + r * 2, 2, 2);
    }
    x += 14;
  }
}

/* ---------------- LCD draw ---------------- */
const lcd = $('lcd'), lctx = lcd.getContext('2d');
function drawLcd() {
  lctx.clearRect(0, 0, lcd.width, lcd.height);
  lctx.fillStyle = '#3a2f1c';
  lctx.fillRect(0, 0, lcd.width, lcd.height);
  const t = presets[cur] ? presets[cur].title : 'COMPAS TEKNO';
  lcdText(lctx, t, 10, 14, true);
  lcdText(lctx, playing ? '> RUN' : '> STOP', 10, 62, false);
  lcdText(lctx, 'BPM ' + bpm, 10, 78, false);
}

/* ---------------- LED strips & pads ---------------- */
function buildGrid() {
  const leds = $('leds'); leds.innerHTML = '';
  for (let i = 0; i < 32; i++) { const d = document.createElement('div'); d.className='led'; leds.appendChild(d); }
  const pads = $('pads'); pads.innerHTML = '';
  if (!presets[cur]) return;
  const steps = presets[cur].steps;
  const p = presets[cur].parts;
  for (let r = 0; r < p.length; r++) {
    for (let i = 0; i < steps; i++) {
      const d = document.createElement('div');
      d.className = 'pad';
      if (p[r].base[i]) d.classList.add('lit');
      d.dataset.r = r; d.dataset.s = i;
      pads.appendChild(d);
    }
  }
}
function updateGrid() {
  if (!presets[cur]) return;
  const steps = presets[cur].steps;
  const pos = fw ? fw.fw_status(ST_POSITION) : 0;
  const ledEls = $('leds').children;
  for (let i = 0; i < 32; i++) {
    ledEls[i].classList.toggle('on', i < steps);
    ledEls[i].classList.toggle('cur', i === (pos % steps));
  }
  const pads = $('pads').children;
  for (let i = 0; i < pads.length; i++) pads[i].classList.toggle('cur', (i % steps) === (pos % steps));
}

/* ---------------- knobs ---------------- */
function knobAngle(el, val, min, max) {
  const a = -135 + (val - min) / (max - min) * 270;
  el.querySelector('.tick').style.transform = `translateX(-50%) rotate(${a}deg)`;
}
function attachKnob(id, min, max, cb) {
  const el = $(id);
  let drag = null;
  el.addEventListener('pointerdown', e => {
    drag = { y: e.clientY, v: parseFloat(el.dataset.v) || min };
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return;
    const dv = (drag.y - e.clientY) / 90 * (max - min);
    const v = Math.max(min, Math.min(max, Math.round(drag.v + dv)));
    el.dataset.v = v; knobAngle(el, v, min, max); cb(v);
  });
  el.addEventListener('pointerup', () => { drag = null; });
  el.dataset.v = min; knobAngle(el, min, min, max);
}

/* ---------------- engine controls ---------------- */
async function init() {
  const wasm = await fetch('emu.wasm').then(r => r.arrayBuffer());
  ({ instance: { exports: fw } } = await WebAssembly.instantiate(wasm, {}));
  presets = await fetch('studies_fw.json').then(r => r.json());
  if (fw.fw_init(44100) !== 0) { alert('engine init failed'); return; }
  fw.fw_command(CP_FEEL, 30, 0);
  $('play').disabled = false; $('prev').disabled = false; $('next').disabled = false;
  buildGrid(); drawLcd();
  setPreset(0);
  $('play').onclick = onPlay;
  $('prev').onclick = () => setPreset((cur + presets.length - 1) % presets.length);
  $('next').onclick = () => setPreset((cur + 1) % presets.length);
  attachKnob('dialBpm', 140, 165, v => { bpm = v; $('bpmval').textContent = v; drawLcd(); if (fw) fw.fw_command(CP_BPM, v, 0); });
  attachKnob('dialVol', 0, 100, v => { vol = v; $('volval').textContent = v; if (gain) gain.gain.value = v / 100; });
  knobAngle($('dialBpm'), 155, 140, 165);
  $('dialBpm').dataset.v = 155;
  knobAngle($('dialVol'), 85, 0, 100);
  $('dialVol').dataset.v = 85;
}
function setPreset(i) {
  const wasPlaying = playing;
  if (wasPlaying) stopAudio();
  cur = i;
  fw.fw_command(CP_STUDY, presets[cur].index, 0);
  $('presetName').textContent = presets[cur].title;
  buildGrid(); drawLcd();
  if (wasPlaying) startAudio();
}
function onPlay() {
  if (!ctx) {
    ctx = new AudioContext();
    gain = ctx.createGain(); gain.gain.value = vol / 100;
    gain.connect(ctx.destination);
  }
  if (ctx.state === 'suspended') ctx.resume();
  if (playing) { stopAudio(); return; }
  (async () => {
    if (!node) {
      await ctx.audioWorklet.addModule('worklet.js');
      node = new AudioWorkletNode(ctx, 'fw-player');
      node.connect(gain);
    }
    fw.fw_command(CP_START, 0, 0);
    playing = true;
    $('play').textContent = '■ STOP'; $('play').classList.add('lit');
    drawLcd();
    renderTimer = setInterval(() => {
      for (let i = 0; i < 4; i++) {
        fw.fw_render(256);
        const buf = new Float32Array(256);
        for (let j = 0; j < 256; j++) buf[j] = fw.fw_pcm(j) / 32768;
        node.port.postMessage(buf, [buf.buffer]);
      }
    }, 25);
    posTimer = setInterval(updateGrid, 50);
  })();
}
function stopAudio() {
  if (renderTimer) { clearInterval(renderTimer); renderTimer = null; }
  if (posTimer) { clearInterval(posTimer); posTimer = null; }
  if (fw) fw.fw_command(CP_STOP, 0, 0);
  playing = false;
  $('play').textContent = '▶ PLAY'; $('play').classList.remove('lit');
  drawLcd(); updateGrid();
}
init();
</script>
</body>
</html>
