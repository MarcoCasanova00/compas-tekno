<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only
     Compás TEKNO — browser emulator.
     Audio playback uses the same packed bank format as the FM-1 firmware
     (tools/board-bank.py output), decoded with the device's delta/RLE player. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compás TEKNO — web emulator</title>
<style>
:root { --bg:#0d0d0f; --fg:#eee; --dim:#9a9aa0; --part:#232327; --edge:#3a3a40;
        --accent:#ff9f1c; --lit:#ffe9bd; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; }
main { max-width:720px; margin:0 auto; padding:28px 16px 40px; }
h1 { font-size:20px; letter-spacing:2px; margin:0 0 2px; }
h1 span { color:var(--accent); }
p.sub { color:var(--dim); margin:0 0 18px; font-size:12px; }
.device { background:#17171a; border:1px solid var(--edge); border-radius:16px; padding:18px; }
.row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:14px; }
label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:1px; }
select { background:var(--part); color:var(--fg); border:1px solid var(--edge);
         border-radius:8px; padding:8px 10px; font:inherit; max-width:240px; }
input[type=range] { width:140px; accent-color:var(--accent); }
button { background:var(--part); color:var(--fg); border:1px solid var(--edge);
         border-radius:10px; padding:10px 22px; font:inherit; cursor:pointer; }
button.lit { background:var(--accent); color:#151515; border-color:var(--accent); }
.grid { display:grid; grid-template-columns:repeat(16,1fr); gap:4px; }
.grid .cell { aspect-ratio:1; background:#111113; border:1px solid var(--edge); border-radius:4px; }
.grid .cell.hit { background:var(--accent); border-color:var(--accent); }
.row.roles { gap:6px; }
.role { font-size:10px; color:var(--dim); width:100%; text-align:center;
         background:#111113; border:1px solid var(--edge); border-radius:4px; padding:3px 0; }
.role.lit { color:#111; background:var(--accent); border-color:var(--accent); }
footer { margin-top:16px; color:var(--dim); font-size:12px; text-align:center; }
footer a { color:var(--dim); }
@media (max-width:520px){ .grid { grid-template-columns:repeat(8,1fr); } }
</style>
</head>
<body>
<main>
  <h1>Compás <span>TEKNO</span></h1>
  <p class="sub">FM-1 rhythm section · UFO French/tribe sample bank · 155 BPM default</p>
  <div class="device">
    <div class="row">
      <label>Preset</label>
      <select id="preset" disabled></select>
      <label>BPM</label>
      <input type="range" id="bpm" min="140" max="165" step="1" value="155">
      <span id="bpmval">155</span>
      <button id="play" disabled>▶ Play</button>
    </div>
    <div class="row">
      <label>Volume</label>
      <input type="range" id="vol" min="0" max="100" value="85">
    </div>
    <div class="row" id="roles"></div>
    <div class="grid" id="grid"></div>
  </div>
  <footer>
    Browser emulator for the modified <a href="https://github.com/TexasRADIO/compas-firmware">Compás</a>
    (GPL-3.0). Samples from UFO tekno banks. Audio decodes the actual firmware
    packed bank — the FM-1 plays this same data.
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
let studies = [], clips = [], bank = null, ctx = null, node = null;
let cur = 0, playing = false;

async function init() {
  const [b, st] = await Promise.all([
    fetch('bank.json').then(r => r.json()),
    fetch('studies.json').then(r => r.json()),
  ]);
  bank = b;
  studies = st;
  const bin = atob(b.packedBase64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const clipsMeta = b.clips;
  clips = clipsMeta.map(c => decodeClip(bytes, c.offset, c.frames));
  // populate UI
  const sel = $('preset');
  st.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = s.title + (i === 0 ? '' : '');
    sel.appendChild(o);
  });
  sel.disabled = false;
  $('play').disabled = false;
  renderRoles();
  renderGrid();
  sel.onchange = () => { cur = +sel.value; renderRoles(); renderGrid(); restart(); };
  $('bpm').oninput = e => { $('bpmval').textContent = e.target.value; if (node) node.port.postMessage({type:'bpm', bpm:+e.target.value}); };
  $('vol').oninput = e => { if (node) node.port.postMessage({type:'vol', vol:+e.target.value/100}); };
  $('play').onclick = async () => {
    if (!ctx) {
      ctx = new AudioContext();
      await ctx.audioWorklet.addModule('worklet.js');
      node = new AudioWorkletNode(ctx, 'tekno-worklet');
      node.connect(ctx.destination);
      node.port.postMessage({type:'init', clips});
      node.port.postMessage({type:'vol', vol:+$('vol').value/100});
    }
    if (ctx.state === 'suspended') await ctx.resume();
    sendSet();
    if (playing) { node.port.postMessage({type:'stop'}); playing = false; $('play').textContent = '▶ Play'; }
    else { node.port.postMessage({type:'play'}); playing = true; $('play').textContent = '■ Stop'; $('play').classList.add('lit'); }
  };
}

function sendSet() {
  const s = studies[cur];
  node.port.postMessage({type:'set', study:cur, parts:s.parts, steps:s.steps, kit:s.kit, bpm:+$('bpm').value});
}

function restart() { if (playing && node) { node.port.postMessage({type:'stop'}); node.port.postMessage({type:'set', study:cur, parts:studies[cur].parts, steps:studies[cur].steps, kit:studies[cur].kit, bpm:+$('bpm').value}); node.port.postMessage({type:'play'}); } }

function renderRoles() {
  const box = $('roles');
  box.innerHTML = '';
  studies[cur].parts.forEach(p => {
    const d = document.createElement('div');
    d.className = 'role'; d.textContent = p.name; d.id = 'role-' + p.name;
    box.appendChild(d);
  });
}

function renderGrid() {
  const g = $('grid'); g.innerHTML = '';
  const s = studies[cur];
  for (let i = 0; i < s.steps; i++) {
    const d = document.createElement('div');
    d.className = 'cell'; d.dataset.step = i;
    g.appendChild(d);
  }
}

function decodeClip(bytes, offset, frames) {
  const out = new Float32Array(frames);
  let pos = offset, repeats = 0, sample = 0;
  for (let i = 0; i < frames; i++) {
    if (repeats) repeats--;
    else {
      let code = bytes[pos++];
      if (code >= 128) { sample = (code - 128) * 256 + bytes[pos++] - 16384; }
      else if (code) { sample += code - 64; }
      else { repeats = bytes[pos++] - 1; }
    }
    out[i] = sample / 32768;
  }
  return out;
}

init();
</script>
</body>
</html>
